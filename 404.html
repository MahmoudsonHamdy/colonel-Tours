<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الصفحة غير موجودة | Colonel Tours</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg0:#07111f;--gold:#d4952f;--gold2:#f0b84a;--t1:#ffffff;--t3:#b8c8de;}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Tajawal',sans-serif;background:
    radial-gradient(ellipse 60% 80% at 72% 48%,rgba(30,68,176,.2) 0%,transparent 60%),
    linear-gradient(155deg,#091425 0%,#07111f 55%,#0b1828 100%);
  color:var(--t3);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem;
}
img{height:56px;margin-bottom:1.6rem;filter:drop-shadow(0 0 10px rgba(212,149,47,.4));}
h1{font-family:'Cairo',sans-serif;font-weight:800;font-size:clamp(4rem,12vw,7rem);color:var(--t1);line-height:1;
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold2) 50%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
p{font-size:1.05rem;margin:1rem 0 2rem;max-width:420px;}
a.btn{display:inline-flex;align-items:center;gap:.6rem;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:var(--bg0);padding:.9rem 2rem;border-radius:6px;font-weight:800;font-size:.95rem;text-decoration:none;}
</style>
</head>
<body>
  <img src="logo-white.png" alt="Colonel Tours">
  <h1>404</h1>
  <p>الصفحة اللي بتدور عليها مش موجودة أو اتنقلت لمكان تاني.</p>
  <a class="btn" href="index.html">→ الرجوع للصفحة الرئيسية</a>
</body>
</html>
